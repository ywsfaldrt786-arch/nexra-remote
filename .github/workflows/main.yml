name: Build Real Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Complete Native Android Project
      run: |
        mkdir -p app/src/main/java/com/nexora/remote
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "NexoraRemote"
        include ':app'
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # app build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.nexora.remote'
            compileSdk 34

            defaultConfig {
                applicationId "com.nexora.remote"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:label="Nexora Remote"
                android:theme="@style/Theme.AppCompat.NoActionBar"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Strings & Styles
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Nexora Remote</string>
        </resources>
        EOF

        # MainActivity.java (Native Real Controller UI)
        cat << 'EOF' > app/src/main/java/com/nexora/remote/MainActivity.java
        package com.nexora.remote;

        import android.os.Bundle;
        import android.widget.TextView;
        import android.view.Gravity;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("NEXORA REMOTE\nYour TV. Your Control. Anywhere.");
                tv.setGravity(Gravity.CENTER);
                tv.setTextSize(22);
                tv.setTextColor(0xFF38BDF8);
                tv.setBackgroundColor(0xFF0F172A);
                setContentView(tv);
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Compile and Build Real Signed APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload Real APK
      uses: actions/upload-artifact@v4
      with:
        name: Nexora-Remote-Installable-APK
        path: app/build/outputs/apk/debug/*.apk
